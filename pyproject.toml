[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-model"
version = "0.1.0"
description = "Dreamer-style world model on Crafter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "torchvision",
  "gymnasium",
  "crafter",
  "minigrid",
  "pyyaml",
  "tensorboard",
  "numpy",
  "pillow",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts"]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "-ra", "--strict-markers", "--color=yes"]
markers = [
  "cuda: needs NVIDIA CUDA (skipped when torch.cuda.is_available() is False)",
  "env: instantiates CrafterReward-v1 (skip with -m \"not env\")",
]
