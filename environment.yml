name: worldmodel
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # torch/torchvision are installed separately from the CUDA 12.8 index
      # (see README / scripts/setup_windows.ps1). Do not pip-install torch
      # from PyPI here — that wheel is CPU-only on Windows and will skip the 5080.
      - gymnasium
      - crafter
      - minigrid
      - pyyaml
      - tensorboard
      - mkdocs-material
      - numpy
      - pillow
      - matplotlib
      - jupyter
      - ipykernel
