# M7 size-S: keep the 1M world model, throw away the dying sapling policy.
#
# Loads M6 joint WM weights (same 19M graph). Actor/critic start random.
# Replay starts empty so the new policy is not trained on the old die-at-190
# buffer. Cannot reach DreamerV3 14.5 (that is XL / ~200M). Use this if
# `count_params.py --smoke --size xl` OOMs.
#
# User-run: notebooks/10_train_paper_online.ipynb with CONFIG pointing here.

seed: 0

world_model_config: configs/sizes/dreamer_s.yaml
world_model_ckpt: checkpoints/m6_baseline/ckpt_latest.pt
actor_critic_ckpt: null
reset_actor: true
seed_replay: null

env:
  id: CrafterReward-v1
  action_dim: 17

actor:
  hidden: 512
  layers: 2
  unimix: 0.01

critic:
  hidden: 512
  layers: 2
  num_bins: 255
  low: -20.0
  high: 20.0

train:
  batch_size: 16
  seq_len: 32
  amp: bf16
  env_steps: 1000000
  collect_every: 16
  wm_updates: 1
  ac_updates: 1
  max_episode_steps: 10000
  prefill_steps: 10000
  replay_max_steps: 500000
  eval_every: 100000
  eval_episodes: 10
  eval_max_steps: 10000
  eval_seed: 100000
  horizon: 15
  start_mode: all
  wm_lr: 1.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  entropy_scale: 3.0e-4
  lam: 0.95
  discount: 0.997
  wm_max_grad_norm: 1000.0
  ac_max_grad_norm: 100.0
  log_every: 256
  dashboard_every: 1000
  image_every: 100000
  checkpoint_every: 50000
  replay_every: 100000
  log_dir: runs/m7_s_reset_actor
  checkpoint_dir: checkpoints/m7_s_reset_actor
  results_dir: results/m7_s_reset_actor
  replay_out: data/m7_s_reset_actor_replay.pt
