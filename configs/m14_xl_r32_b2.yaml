# M14 — XL blocks=2 from scratch at workstation train_ratio 32.
#
# Not the paper 512 run. 1 WM+AC / 16 env (~26 env/s historically; 1M ≈ hours,
# not 5 days). Same CNN as M13 (blocks=2). Do not load m13/m12/m9.
# Caption as ratio-32 + blocks=2, not 14.5.
#
# Notebook 10: interrupt M13, restart kernel, run from the top. Status 0/1M.

seed: 0

world_model_config: configs/sizes/dreamer_xl_b2.yaml
world_model_ckpt: null
actor_critic_ckpt: null
reset_actor: true
seed_replay: null

env:
  id: CrafterReward-v1
  action_dim: 17

actor:
  hidden: 1024
  layers: 5
  unimix: 0.01

critic:
  hidden: 1024
  layers: 5
  num_bins: 255
  low: -20.0
  high: 20.0
  slow_target: true
  slow_target_fraction: 0.02
  slow_target_update: 1

train:
  batch_size: 16
  seq_len: 32
  amp: bf16
  env_steps: 1000000
  collect_every: 16
  train_ratio: 32
  wm_updates: 1
  ac_updates: 1
  max_episode_steps: 10000
  prefill_steps: 2500
  pretrain_steps: 100
  pretrain_wm_steps: 100
  replay_max_steps: 500000
  eval_every: 50000
  eval_episodes: 10
  eval_max_steps: 10000
  eval_seed: 100000
  horizon: 15
  start_mode: all
  imag_gradient: reinforce
  wm_lr: 1.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  entropy_scale: 3.0e-4
  lam: 0.95
  discount: 0.997
  dyn_scale: 0.5
  rep_scale: 0.1
  wm_max_grad_norm: 1000.0
  ac_max_grad_norm: 100.0
  log_every: 256
  dashboard_every: 1000
  image_every: 100000
  checkpoint_every: 50000
  replay_every: 100000
  log_dir: runs/m14_xl_r32_b2
  checkpoint_dir: checkpoints/m14_xl_r32_b2
  results_dir: results/m14_xl_r32_b2
  replay_out: data/m14_xl_r32_b2_replay.pt
