# M21 — craft the iron pickaxe as soon as its own recipe is in hand.
#
# M20 finished 200k (finding 50): last-200 gmean 15.7, stone pickaxe 13.5%,
# coal 18.5%, furnace 4%, iron 0.5%, iron pickaxe 0 in that window
# (3/944 lives, all before 166k). Teacher v2 gathers coal and iron for both
# iron tools before crafting either, and dies on the walk home (2/8 iron
# pickaxes on seeds 0–7). Teacher v3 crafts at 1 wood + 1 coal + 1 iron
# and skips the hunt once that recipe is in hand (4/8 on the same seeds).
#
# Same XL local-map graph as M20. Weights load from the M20 final
# checkpoint. Replay is new, so behavior cloning sees v3 lives rather than
# the M20 buffer. Eval never calls the teacher. Budget 100k.

seed: 0
actor_input_source: truth

world_model_config: configs/sizes/dreamer_xl_paper_local.yaml
world_model_ckpt: checkpoints/m20_local_map/ckpt_final.pt
actor_critic_ckpt: checkpoints/m20_local_map/ckpt_final.pt
reset_actor: false
seed_replay: null

env:
  id: CrafterReward-v1
  action_dim: 17

actor:
  hidden: 1024
  layers: 5
  unimix: 0.01

critic:
  hidden: 1024
  layers: 5
  num_bins: 255
  low: -20.0
  high: 20.0
  slow_target: true
  slow_target_fraction: 0.02
  slow_target_update: 1

train:
  batch_size: 8
  seq_len: 64
  amp: bf16
  env_steps: 100000
  collect_every: 16
  train_ratio: 512
  wm_updates: 16
  ac_updates: 16
  ac_warmup_env: 0
  max_episode_steps: 10000
  prefill_steps: 2500
  prefill_mask_illegal: true
  teacher_episodes: 32
  teacher_max_steps: 800
  teacher_fraction: 0.5
  teacher_version: 3
  teacher_inject_every: 25000
  teacher_inject_episodes: 8
  bc_scale: 1.0
  pretrain_steps: 100
  pretrain_wm_steps: 100
  replay_max_steps: 1000000
  eval_every: 25000
  eval_episodes: 10
  eval_max_steps: 10000
  eval_seed: 100000
  horizon: 15
  start_mode: all
  imag_gradient: reinforce
  wm_lr: 1.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  entropy_scale: 3.0e-4
  lam: 0.95
  discount: 0.997
  dyn_scale: 0.5
  rep_scale: 0.1
  free_nats: 1.0
  inventory_scale: 1.0
  spatial_scale: 1.0
  local_scale: 1.0
  local_object_weight: 4.0
  wm_max_grad_norm: 1000.0
  ac_max_grad_norm: 100.0
  log_every: 256
  # A figure on every log (256) blocks the notebook channel (finding 08, 49).
  dashboard_every: 5000
  image_every: 50000
  checkpoint_every: 25000
  replay_every: 50000
  log_dir: runs/m21_iron_craft
  checkpoint_dir: checkpoints/m21_iron_craft
  results_dir: results/m21_iron_craft
  replay_out: data/m21_iron_craft_replay.pt
