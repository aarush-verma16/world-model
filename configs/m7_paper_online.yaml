# M7 — DreamerV3 XL online 1M (paper outer-loop recipe).
#
# Size XL (~198M WM / ~214M total). Cannot load M6 (size-S). Fresh actor.
# Do NOT resume checkpoints/m7_paper_online — that run collapsed (finding 14).
#
# Matched to NM512/dreamerv3-torch Crafter:
#   prefill 2500 uniform-random env steps (not one untrained-actor life)
#   WM pretrain 100 steps on that buffer before any actor update
#   train_ratio 512  →  16 WM + 16 AC updates per 16 env steps at seq 32
#   imag_gradient reinforce (discrete Crafter; no STE dynamics actor term)
#   entropy 3e-4, actor/critic lr 3e-5, WM lr 1e-4, horizon 15, unimix 0.01
#   dyn/rep 0.5 / 0.1 (paper / torch defaults, not the frozen-replay M3 1.0/0.5)
#
# seq 64 is the paper batch_length; it filled 16 GiB on this card at size-S.
# Stay at 32; train_ratio 512 keeps the same transitions-per-env-step.
# Replay FIFO 500k not 1e6 — host RAM (finding 08).
#
# User-run: notebooks/10_train_paper_online.ipynb
# Stop the collapsed kernel first. Watch ac_H — if it sits near 0.08, stop.

seed: 0

world_model_config: configs/sizes/dreamer_xl.yaml
world_model_ckpt: null
actor_critic_ckpt: null
reset_actor: true
seed_replay: null

env:
  id: CrafterReward-v1
  action_dim: 17

actor:
  hidden: 1024
  layers: 5
  unimix: 0.01

critic:
  hidden: 1024
  layers: 5
  num_bins: 255
  low: -20.0
  high: 20.0

train:
  batch_size: 16
  seq_len: 32
  amp: bf16
  env_steps: 1000000
  collect_every: 16
  train_ratio: 512
  # Explicit copies of loop_updates(train_ratio=512, batch 16, seq 32).
  # Keep these so a notebook that still does train["wm_updates"] does not crash.
  wm_updates: 16
  ac_updates: 16
  max_episode_steps: 10000
  prefill_steps: 2500
  pretrain_wm_steps: 100
  replay_max_steps: 500000
  eval_every: 100000
  eval_episodes: 10
  eval_max_steps: 10000
  eval_seed: 100000
  horizon: 15
  start_mode: all
  imag_gradient: reinforce
  wm_lr: 1.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  entropy_scale: 3.0e-4
  lam: 0.95
  discount: 0.997
  dyn_scale: 0.5
  rep_scale: 0.1
  wm_max_grad_norm: 1000.0
  ac_max_grad_norm: 100.0
  log_every: 256
  dashboard_every: 1000
  image_every: 100000
  checkpoint_every: 50000
  replay_every: 100000
  log_dir: runs/m7_xl_paper
  checkpoint_dir: checkpoints/m7_xl_paper
  results_dir: results/m7_xl_paper
  replay_out: data/m7_xl_paper_replay.pt
