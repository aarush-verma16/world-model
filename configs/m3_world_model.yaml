# Milestone 3 — world-model training.
#
# Wiring (this is the architecture, not a loss knob):
#   skip-free ResNet Encoder (DreamerV3 ImageEncoderResnet: stride-2 then
#   residual 3x3 blocks at 32/16/8/4) → SpatialPosterior RSSM → one shared
#   4x4 decoder. Embed reshapes the encoder map; [h,z] predicts that map
#   per-cell (32 categoricals = 2 per cell) then paints with the same
#   upsample, decoder weights detached. recon_map L1 aligns the maps.
#   recon_blob is 7px-tile L1 on the local view (cows/zombies, not trees-only).
#   recon_avatar is the 3x3 player crop. recon_hud is a 2x9 slot-grid head
#   on the inventory strip (4px amount glyphs). Not 8px decoder, not edge_weight.
#
# The 4-layer stride-2 stack (no residuals) averaged 8-12px cows/HUD/trees
# into grass before they could become features. Residual blocks at each
# scale are how DreamerV3's CNN actually works (`cnn_blocks=2`). Still 4x4
# flatten — not U-Net skip-to-RGB, not 8px decoder cells.
#
# Failed experiments that did not fix missing sprites/HUD (do not revive):
#   - M1 U-Net (`PerceptionAutoencoder`) as the world-model encoder. Its
#     `stem_to_rgb(skips[0])` copies the real frame, so the dashboard "embed
#     + skips" panel looked solved while RSSM never saw that content.
#   - Mixing Linear: `embed_dim` != channels[-1]*4*4 (was 2048 vs 8192).
#   - 8×8 spatial bottleneck ("8 px cells"). Reverted; stay at 4×4.
#   - `edge_weight` / `grad_scale` stacked on unweighted L1. Off.
#   - `recon_scale=40` + `kl_scale=0.1` (z ~ noise, mean-color collapse).
#
# Identity flatten is C*4*4, but the posterior used to be
# Linear(C*16 + deter, hidden) — mixing every 4x4 cell before z. That is
# why embed recon can show land/water while [h,z] stays mean grass + one
# HUD blob. When embed_dim == channels[-1]*16, RSSM uses SpatialPosterior
# (conv on the 4x4 map, then logits).

seed: 0

encoder:
  # 12288 == channels[-1]*4*4 (768*16). Flatten IS the embedding (no mixing
  # Linear). ResNet stages (blocks=2) match DreamerV3 ImageEncoderResnet.
  embed_dim: 12288
  channels: [96, 192, 384, 768]
  blocks: 2

rssm:
  deter_dim: 512
  stoch: 32
  classes: 32
  hidden: 512
  unimix: 0.01
  act: silu
  initial: learned
  rec_depth: 1

decoder:
  # Residual blocks live on the encoder. Two ResNet decoders OOMed the 16
  # GiB card (19 GiB / 0.17 steps/s in a smoke). Keep this at 0.
  channels: [768, 384, 192, 96]
  blocks: 0

heads:
  hidden: 512
  layers: 2

env:
  id: CrafterReward-v1
  action_dim: 17

collect:
  num_episodes: 80
  max_episode_steps: 400
  out_path: data/m3_replay.pt

train:
  # Windows / RTX 5080 (16 GiB dedicated VRAM, ~1.5 GiB already used by the
  # desktop compositor). Replay lives in the 32 GiB system RAM; only the
  # current window sits on the GPU. bf16 AMP halves activation memory vs the
  # Mac fp32 run. DreamerV3's published recipe is batch 16 x seq 64 -- a live
  # smoke on this box filled 15.8 / 16.3 GiB at that size and thrashed, so
  # seq_len stays 32 (same temporal window as the Mac run) while batch_size
  # goes 4 -> 16. That is 4x the frames per step of the swap-safe Mac config.
  # If nvidia-smi shows lots of free VRAM after a few steps, seq_len 32 -> 64
  # is the next knob; if a step OOMs, drop batch_size 16 -> 8.
  batch_size: 16
  seq_len: 32
  # bf16 AMP (native on RTX 30/40/50). No GradScaler. Set to "off" only if
  # you are chasing a numerical discrepancy against an old fp32 Mac ckpt.
  amp: bf16
  lr: 1.0e-4
  steps: 12000
  log_every: 50
  checkpoint_every: 1000
  # Must stay <= log_every, or the displayed recon grid goes stale between
  # refreshes and looks "collapsed" even though training is progressing
  # (this is what happened: image panel was 500 steps behind the loss curve).
  image_every: 50
  dyn_scale: 0.5
  rep_scale: 0.1
  free_nats: 1.0
  recon_loss: l1
  # Primary: decode from [h, z_posterior]
  recon_scale: 5.0
  # Skip-free embed → pixels (what the RSSM actually receives).
  recon_embed_scale: 5.0
  # Same tensor as recon_embed (kept so old logs still have the key). Must
  # stay 0 or the embed recon is counted twice.
  recon_bottleneck_scale: 0.0
  # Align [h,z]'s 4x4 map to the encoder map (detached). This is why embed
  # can show land/water while [h,z] is mean grass: they used two decoders
  # and a mixing Linear into pixels. Shared upsample + this term makes
  # HzToMap copy the layout embed already has.
  recon_map_scale: 1.0
  # 8x8 pooled L1 on [h,z] and embed recon. 64x64 L1 is a median: an 8px
  # cow in a 16x16 patch is a minority, so the optimum is grass and you
  # never even get a blur. Crafter tiles are 8px; this term makes them a
  # majority of their cell. Not edge_weight (1px HUD), not 8px decoder.
  recon_blob_scale: 5.0
  # 3x3 tiles around the Crafter player (always the same camera tile).
  # Full-frame L1 keeps a mean-pose blob; this crop makes facing/tool move.
  # CAUTION: this crop is 441px vs the 4096px full frame. Scale 5.0 here
  # (same as recon_scale, which is a MEAN over 4096px) gave avatar pixels
  # ~9x the per-pixel gradient weight of a generic grass pixel -- at step
  # ~1000 the model spent most of its capacity on the avatar blob + HUD
  # icons and left the rest of the frame flat (no dithering/blur at all,
  # unlike every earlier run). 1.0 is close to area-fair (5.0 * 441/4096).
  recon_avatar_scale: 1.0
  # Inventory strip via a 2x9 slot-grid head off the bottom 4x4 row.
  # Amount glyphs are ~4px in a 7px slot — not 1px digits, not skip-to-RGB.
  # Same over-weighting bug as recon_avatar_scale (882px crop, plus this
  # loss is pixel+slot L1 summed, doubling it again). 1.0 is ~area-fair.
  recon_hud_scale: 1.0
  reward_scale: 1.0
  continue_scale: 1.0
  kl_scale: 1.0
  # Off. A skip-free decoder will not match 1-2px HUD digits; boosting those
  # pixels just floors the logged loss. Watch unweighted `recon_l1`.
  grad_scale: 0.0
  edge_weight: 0.0
  log_dir: runs/m3_world_model
  checkpoint_dir: checkpoints/m3_world_model
  results_dir: results/m3
