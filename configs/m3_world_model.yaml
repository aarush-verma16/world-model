# Milestone 3 — world-model training.
#
# Wiring (this is the architecture, not a loss knob):
#   skip-free ResNet Encoder (DreamerV3 ImageEncoderResnet: stride-2 then
#   residual 3x3 blocks at 32/16/8/4) → SpatialPosterior RSSM → one shared
#   4x4 decoder. Embed reshapes the encoder map; [h,z] predicts that map
#   (HzToMap) then paints with the same upsample, decoder weights frozen on
#   that paint so [h,z] must match a map the encoder already renders well.
#   recon_map L1 aligns the maps. Pixel L1 trains texture + inventory.
#   recon_blob is off. free_nats=1. Per-cell z is off (it parked KL at 1.2–1.6).
#
# Two structural fixes after the 12k run came out blurry, sprite-free, with
# [h,z] placing terrain in the wrong spots:
#
#   1. Decoder upsampling is **sub-pixel conv** (PixelShuffle + ICNR), not
#      `Upsample(mode="nearest")`. Nearest copies each latent cell into a 2x2
#      block of identical values, so the next 3x3 conv cannot tell where inside
#      the cell it is. At a 4x4 latent a cell is 16x16 px, so all the sub-cell
#      phase a 7px tree/zombie/sapling and the 1-2px inventory digits are made
#      of was discarded before any conv could use it. That is the real source
#      of the flat 16x16 blocks — it was never a loss-weight problem.
#   2. `HzToMap` gives `h` a **spatial** projection. It was a [B,C,1,1]
#      per-channel bias identical in all 16 cells, so 100% of [h,z] layout came
#      from z's 160 bits/frame. See `rssm.deter_dim` below.
#
# Failed experiments that did not fix missing sprites/HUD (do not revive):
#   - M1 U-Net (`PerceptionAutoencoder`) as the world-model encoder. Its
#     `stem_to_rgb(skips[0])` copies the real frame, so the dashboard "embed
#     + skips" panel looked solved while RSSM never saw that content.
#   - Mixing Linear: `embed_dim` != channels[-1]*4*4 (was 2048 vs 8192).
#   - 8×8 spatial bottleneck ("8 px cells"). Rejected; stay at 4×4. Sub-pixel
#     conv is the fix for sub-cell detail, not a finer latent grid.
#   - `edge_weight` / `grad_scale` stacked on unweighted L1. Off.
#   - `recon_scale=40` + `kl_scale=0.1` (z ~ noise, mean-color collapse).
#   - `recon_blob_scale=5.0` (solid-color-per-tile objective).
#   - A pasted HUD head over rows 49–63 (stayed black, hid the inventory).
#
# Identity flatten is C*4*4, but the posterior used to be
# Linear(C*16 + deter, hidden) — mixing every 4x4 cell before z. That is
# why embed recon can show land/water while [h,z] stays mean grass + one
# HUD blob. When embed_dim == channels[-1]*16, RSSM uses SpatialPosterior
# (conv on the 4x4 map, then logits).

seed: 0

encoder:
  # 12288 == channels[-1]*4*4 (768*16). Flatten IS the embedding (no mixing
  # Linear). ResNet stages (blocks=2) match DreamerV3 ImageEncoderResnet.
  embed_dim: 12288
  channels: [96, 192, 384, 768]
  blocks: 2

rssm:
  # 512 was DreamerV3 size-S paired with an XL CNN. `h` is the only place a
  # *persistent* Crafter map can live: h_t = GRU(h_{t-1}, [z_{t-1}, a_{t-1}])
  # sees no current frame, so the only per-frame information reaching the
  # decoder is z (32 cats x 32 classes = 160 bits) — which cannot place 63
  # tiles plus a 9-slot inventory. Grass/water/trees do not move, so giving
  # `h` size-L capacity is what stops [h,z] hallucinating layout. A larger `h`
  # also makes the prior better at predicting z, which pushes KL raw *down*.
  deter_dim: 2048
  stoch: 32
  classes: 32
  hidden: 512
  unimix: 0.01
  act: silu
  initial: learned
  rec_depth: 1

decoder:
  # Residual blocks live on the encoder. Two ResNet decoders OOMed the 16
  # GiB card (19 GiB / 0.17 steps/s in a smoke). Keep this at 0.
  channels: [768, 384, 192, 96]
  blocks: 0

heads:
  hidden: 512
  layers: 2

env:
  id: CrafterReward-v1
  action_dim: 17

collect:
  num_episodes: 80
  max_episode_steps: 400
  out_path: data/m3_replay.pt

train:
  # Windows / RTX 5080 (16 GiB dedicated VRAM, ~1.5 GiB already used by the
  # desktop compositor). Replay lives in the 32 GiB system RAM; only the
  # current window sits on the GPU. bf16 AMP halves activation memory vs the
  # Mac fp32 run.
  #
  # DreamerV3's published recipe is batch 16 x seq 64. Do not try it on this
  # box. Re-measured with the sub-pixel decoder (`scripts/smoke_cuda_step.py`):
  #   batch 16 x seq 32 -> 8.8 GiB allocated / 9.5 reserved, 0.29 s/step
  #   batch 16 x seq 64 -> 15.8 GiB allocated / 16.1 reserved, 33 s/step
  # 64 does not OOM, it thrashes: ~100x slower for a 2x longer window. If a
  # step ever does OOM, drop batch_size 16 -> 8 rather than touching seq_len.
  batch_size: 16
  seq_len: 32
  # bf16 AMP (native on RTX 30/40/50). No GradScaler. Set to "off" only if
  # you are chasing a numerical discrepancy against an old fp32 Mac ckpt.
  amp: bf16
  lr: 1.0e-4
  steps: 12000
  log_every: 50
  checkpoint_every: 1000
  # Must stay <= log_every, or the displayed recon grid goes stale between
  # refreshes and looks "collapsed" even though training is progressing
  # (this is what happened: image panel was 500 steps behind the loss curve).
  image_every: 50
  dyn_scale: 0.5
  rep_scale: 0.1
  free_nats: 1.0
  recon_loss: l1
  # Primary: decode from [h, z_posterior]
  recon_scale: 5.0
  # Skip-free embed → pixels (what the RSSM actually receives).
  recon_embed_scale: 5.0
  # Same tensor as recon_embed (kept so old logs still have the key). Must
  # stay 0 or the embed recon is counted twice.
  recon_bottleneck_scale: 0.0
  # Align [h,z]'s 4x4 map to the encoder map (detached). This is why embed
  # can show land/water while [h,z] is mean grass: they used two decoders
  # and a mixing Linear into pixels. Shared upsample + this term makes
  # HzToMap copy the layout embed already has.
  recon_map_scale: 1.0
  # Off. 7px-tile mean L1 is "paint each Crafter tile one color". At scale
  # 5.0 (same as full-frame recon) that wiped grass dithering, water
  # ripples, and HUD icon texture — solid blue/green fields and one left
  # heart. Sprites still have to live in the encoder; pixel L1 is enough
  # to start them as blurs once the renderer is allowed texture.
  recon_blob_scale: 0.0
  # Crop losses on the player (21×21 = 441 px) and inventory strip
  # (14×63 = 882 px). These were 5.0 with a pasted HUD head, which
  # over-weighted the crops and then painted over the inventory anyway. The
  # head is gone; what is left is plain L1 on a crop, so the weight is set
  # from the arithmetic instead of guessed. Full-frame L1 gives each pixel
  # 5.0/4096. A crop term of scale s gives its pixels s/n_crop_px extra:
  #   avatar 0.5/441   = 1.13e-3 vs 1.22e-3  -> ~1.9x total
  #   hud    0.5/882 x2 (hud_recon_loss is pixel L1 + slot-mean L1)
  #                    = 1.13e-3 vs 1.22e-3  -> ~1.9x total
  # ~2x is enough to stop 4px inventory glyphs and the player sprite being
  # rounded off as noise against 4096 mostly-grass pixels, and small enough
  # that it cannot flatten the rest of the frame the way 5.0 did.
  recon_avatar_scale: 0.5
  recon_hud_scale: 0.5
  reward_scale: 1.0
  continue_scale: 1.0
  kl_scale: 1.0
  # Off. A skip-free decoder will not match 1-2px HUD digits; boosting those
  # pixels just floors the logged loss. Watch unweighted `recon_l1`.
  grad_scale: 0.0
  edge_weight: 0.0
  log_dir: runs/m3_world_model
  checkpoint_dir: checkpoints/m3_world_model
  results_dir: results/m3
