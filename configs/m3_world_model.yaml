# Milestone 3 — world-model training (balanced Dreamer-style recipe).
#
# Failed experiment (stop if still running): recon_scale=40 + kl_scale=0.1 made
# z ~ noise; decoder collapsed to solid mean background color by ~step 500.
# This config restores KL pressure, adds an encoder→pixel aux recon so the
# encoder stays sharp, and keeps a stronger but not oversized latent.
#
# stoch/classes bumped 16x16 -> 32x32: that's DreamerV3's standard latent size
# across all their published model scales (arXiv:2301.04104). A 16x16 latent
# (256 total classes) has ~4x less raw representational capacity than what the
# recipe this repo follows actually uses. Note that the primary `[h,z]`
# decoder can never use U-Net skip connections like M1's autoencoder does
# (imagined rollouts have no raw pixels to skip from), so genuine latent/model
# capacity is one legitimate lever for its sharpness -- but it's not the only
# one, see grad_scale below.
#
# grad_scale added: a run at the 32x32 latent was still visibly improving
# (recon trend was -10% i.e. still dropping, not plateaued) at step ~9k, yet
# the background and HUD bar stayed blurry/illegible. Root cause isn't
# capacity, it's the objective: plain per-pixel L1 rewards matching a region's
# *average* color, so a 1-2px sprite outline or HUD icon/number stroke (a
# small fraction of a region's pixels, confirmed by inspecting a real frame --
# the HUD bar's icon/number detail lives in ~4 of its ~15 rows, the rest is
# flat black) barely moves that average. `grad_scale` adds an L1 loss on
# image finite-difference gradients (see `gradient_l1_loss`), which explicitly
# rewards matching *where* the image changes -- i.e. edges/outlines/text --
# not just its color. This is the standard fix for "loss keeps dropping but
# output stays smeared" in pixel-reconstruction models.

seed: 0

encoder:
  embed_dim: 2048
  channels: [64, 128, 256, 512]

rssm:
  deter_dim: 512
  stoch: 32
  classes: 32
  hidden: 512
  unimix: 0.01
  act: silu
  initial: learned
  rec_depth: 1

decoder:
  channels: [512, 256, 128, 64]

heads:
  hidden: 512
  layers: 2

env:
  id: CrafterReward-v1
  action_dim: 17

collect:
  num_episodes: 80
  max_episode_steps: 400
  out_path: data/m3_replay.pt

train:
  batch_size: 8
  seq_len: 32
  lr: 1.0e-4
  steps: 12000
  log_every: 50
  checkpoint_every: 1000
  # Must stay <= log_every, or the displayed recon grid goes stale between
  # refreshes and looks "collapsed" even though training is progressing
  # (this is what happened: image panel was 500 steps behind the loss curve).
  image_every: 50
  dyn_scale: 0.5
  rep_scale: 0.1
  free_nats: 1.0
  recon_loss: l1
  # Primary: decode from [h, z_posterior]
  recon_scale: 5.0
  # Aux: decode from encoder embed (keeps perception sharp early)
  recon_embed_scale: 5.0
  reward_scale: 1.0
  continue_scale: 1.0
  kl_scale: 1.0
  # Edge-aware term on [h,z] + embed decodes combined (see comment above).
  # Sized against an untrained-model check: grad_l1 raw values run ~4x
  # smaller than pixel L1 at the same point in training, so this scale is set
  # noticeably higher than recon_scale to give edges real weight in the total.
  grad_scale: 15.0
  log_dir: runs/m3_world_model
  checkpoint_dir: checkpoints/m3_world_model
  results_dir: results/m3
