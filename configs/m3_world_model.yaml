# Milestone 3 — world-model training.
#
# Wiring (this is the architecture, not a loss knob):
#   skip-free Encoder (4 stride-2 convs) → RSSM → skip-free [h,z] decoder
#   + skip-free embed→pixel aux (supervises the vector RSSM actually sees)
#
# Failed experiments that did not fix missing sprites/HUD (do not revive):
#   - M1 U-Net (`PerceptionAutoencoder`) as the world-model encoder. Its
#     `stem_to_rgb(skips[0])` copies the real frame, so the dashboard "embed
#     + skips" panel looked solved while RSSM never saw that content.
#   - Mixing Linear: `embed_dim` != channels[-1]*4*4 (was 2048 vs 8192).
#   - 8×8 spatial bottleneck ("8 px cells"). Reverted; stay at 4×4.
#   - `edge_weight` / `grad_scale` stacked on unweighted L1. Off.
#   - `recon_scale=40` + `kl_scale=0.1` (z ~ noise, mean-color collapse).
#
# `embed_dim: 12288` == 768*4*4 so Encoder.fc and embed_decoder.fc are
# Identity (flatten is the embedding; no mixing Linear).
# `recon_bottleneck_scale` must stay 0: that tensor is the same as recon_embed.

seed: 0

encoder:
  # 12288 == channels[-1]*4*4 (768*16). Flatten IS the embedding (no mixing
  # Linear). World model uses the skip-free `Encoder`, not M1's U-Net.
  embed_dim: 12288
  channels: [96, 192, 384, 768]

rssm:
  deter_dim: 512
  stoch: 32
  classes: 32
  hidden: 512
  unimix: 0.01
  act: silu
  initial: learned
  rec_depth: 1

decoder:
  # channels[0]=768 matches encoder.channels[-1], so embed_decoder's fc is
  # Identity (768*4*4=12288).
  channels: [768, 384, 192, 96]

heads:
  hidden: 512
  layers: 2

env:
  id: CrafterReward-v1
  action_dim: 17

collect:
  num_episodes: 80
  max_episode_steps: 400
  out_path: data/m3_replay.pt

train:
  # Windows / RTX 5080 (16 GiB dedicated VRAM, ~1.5 GiB already used by the
  # desktop compositor). Replay lives in the 32 GiB system RAM; only the
  # current window sits on the GPU. bf16 AMP halves activation memory vs the
  # Mac fp32 run. DreamerV3's published recipe is batch 16 x seq 64 -- a live
  # smoke on this box filled 15.8 / 16.3 GiB at that size and thrashed, so
  # seq_len stays 32 (same temporal window as the Mac run) while batch_size
  # goes 4 -> 16. That is 4x the frames per step of the swap-safe Mac config.
  # If nvidia-smi shows lots of free VRAM after a few steps, seq_len 32 -> 64
  # is the next knob; if a step OOMs, drop batch_size 16 -> 8.
  batch_size: 16
  seq_len: 32
  # bf16 AMP (native on RTX 30/40/50). No GradScaler. Set to "off" only if
  # you are chasing a numerical discrepancy against an old fp32 Mac ckpt.
  amp: bf16
  lr: 1.0e-4
  steps: 12000
  log_every: 50
  checkpoint_every: 1000
  # Must stay <= log_every, or the displayed recon grid goes stale between
  # refreshes and looks "collapsed" even though training is progressing
  # (this is what happened: image panel was 500 steps behind the loss curve).
  image_every: 50
  dyn_scale: 0.5
  rep_scale: 0.1
  free_nats: 1.0
  recon_loss: l1
  # Primary: decode from [h, z_posterior]
  recon_scale: 5.0
  # Skip-free embed → pixels (what the RSSM actually receives).
  recon_embed_scale: 5.0
  # Same tensor as recon_embed (kept so old logs still have the key). Must
  # stay 0 or the embed recon is counted twice.
  recon_bottleneck_scale: 0.0
  reward_scale: 1.0
  continue_scale: 1.0
  kl_scale: 1.0
  # Off. A skip-free decoder will not match 1-2px HUD digits; boosting those
  # pixels just floors the logged loss. Watch unweighted `recon_l1`.
  grad_scale: 0.0
  edge_weight: 0.0
  log_dir: runs/m3_world_model
  checkpoint_dir: checkpoints/m3_world_model
  results_dir: results/m3
