# M12 — XL from scratch at train_ratio 512 (DreamerV3 Crafter replay rate).
#
# Paper schedule: 16 WM+AC / 16 env. This box: ~2 env/s, 1M ≈ 5.4 days
# (finding 15). 1 day ≈ 180k. Halfway ≈ 500k / ~2.5 days — interrupt there
# if last-200 is moving and you want to stop. Leave the cell running to
# continue. Do not load m7_xl_paper (broken AC), m9, m10, or m11.
#
# Do not load m7_xl_paper (broken AC graph), m9, m10, or m11.
# Notebook 10: RESUME=None, restart kernel, run from the top. Status 0/1M.

seed: 0

world_model_config: configs/sizes/dreamer_xl.yaml
world_model_ckpt: null
actor_critic_ckpt: null
reset_actor: true
seed_replay: null

env:
  id: CrafterReward-v1
  action_dim: 17

actor:
  hidden: 1024
  layers: 5
  unimix: 0.01

critic:
  hidden: 1024
  layers: 5
  num_bins: 255
  low: -20.0
  high: 20.0
  slow_target: true
  slow_target_fraction: 0.02
  slow_target_update: 1

train:
  batch_size: 16
  seq_len: 32
  amp: bf16
  env_steps: 1000000
  collect_every: 16
  train_ratio: 512
  wm_updates: 16
  ac_updates: 16
  max_episode_steps: 10000
  prefill_steps: 2500
  pretrain_steps: 100
  pretrain_wm_steps: 100
  replay_max_steps: 500000
  eval_every: 25000
  eval_episodes: 10
  eval_max_steps: 10000
  eval_seed: 100000
  horizon: 15
  start_mode: all
  imag_gradient: reinforce
  wm_lr: 1.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  entropy_scale: 3.0e-4
  lam: 0.95
  discount: 0.997
  dyn_scale: 0.5
  rep_scale: 0.1
  wm_max_grad_norm: 1000.0
  ac_max_grad_norm: 100.0
  log_every: 256
  dashboard_every: 1000
  image_every: 50000
  checkpoint_every: 25000
  replay_every: 50000
  log_dir: runs/m12_xl_r512
  checkpoint_dir: checkpoints/m12_xl_r512
  results_dir: results/m12_xl_r512
  replay_out: data/m12_xl_r512_replay.pt
