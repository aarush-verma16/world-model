# M20 — local 9x7 map, whole-life teacher, clone teacher actions.
#
# M19 at 51k: last-200 gmean 4.19, table 52%, pickaxe 11.5%, stone 3%,
# length 175, stone pickaxe 0. Facing names one tile. The teacher stopped
# after the first stone, so the world model never saw the rest of the tree.
# This run:
#   1. Feeds the actor the same 9x7 grid the renderer draws (finding 47).
#   2. Writes whole lives from CrafterTeacherV2 (table through iron, combat)
#      and keeps injecting them so they are not drowned (finding 48).
#   3. Behavior-clones those actions on teacher steps (bc_scale).
# Eval never calls the teacher. New dirs. Do not load m6–m19. Budget 500k.

seed: 0
actor_input_source: truth

world_model_config: configs/sizes/dreamer_xl_paper_local.yaml
world_model_ckpt: null
actor_critic_ckpt: null
reset_actor: true
seed_replay: null

env:
  id: CrafterReward-v1
  action_dim: 17

actor:
  hidden: 1024
  layers: 5
  unimix: 0.01

critic:
  hidden: 1024
  layers: 5
  num_bins: 255
  low: -20.0
  high: 20.0
  slow_target: true
  slow_target_fraction: 0.02
  slow_target_update: 1

train:
  batch_size: 8
  seq_len: 64
  amp: bf16
  env_steps: 500000
  collect_every: 16
  train_ratio: 512
  wm_updates: 16
  ac_updates: 16
  ac_warmup_env: 0
  max_episode_steps: 10000
  prefill_steps: 2500
  prefill_mask_illegal: true
  teacher_episodes: 32
  teacher_max_steps: 800
  teacher_fraction: 0.5
  teacher_version: 2
  teacher_inject_every: 25000
  teacher_inject_episodes: 8
  bc_scale: 1.0
  pretrain_steps: 100
  pretrain_wm_steps: 100
  replay_max_steps: 1000000
  eval_every: 25000
  eval_episodes: 10
  eval_max_steps: 10000
  eval_seed: 100000
  horizon: 15
  start_mode: all
  imag_gradient: reinforce
  wm_lr: 1.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  entropy_scale: 3.0e-4
  lam: 0.95
  discount: 0.997
  dyn_scale: 0.5
  rep_scale: 0.1
  free_nats: 1.0
  inventory_scale: 1.0
  spatial_scale: 1.0
  local_scale: 1.0
  local_object_weight: 4.0
  wm_max_grad_norm: 1000.0
  ac_max_grad_norm: 100.0
  log_every: 256
  dashboard_every: 256
  image_every: 50000
  checkpoint_every: 25000
  replay_every: 50000
  log_dir: runs/m20_local_map
  checkpoint_dir: checkpoints/m20_local_map
  results_dir: results/m20_local_map
  replay_out: data/m20_local_map_replay.pt
